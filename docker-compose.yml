services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${SEWASETU_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewasetu -d sewasetu"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    environment:
      SEWASETU_SECRET_KEY: ${SEWASETU_SECRET_KEY}
      SEWASETU_ADMIN_PASSWORD: ${SEWASETU_ADMIN_PASSWORD}
      SEWASETU_DB_PASSWORD: ${SEWASETU_DB_PASSWORD}
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEWASETU_DB_PASSWORD: ${SEWASETU_DB_PASSWORD}
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
