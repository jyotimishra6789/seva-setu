{% extends "base.html" %}
{% block content %}
<div class="language-choice" data-speech-language="en-IN">
  <h2>{{ t.choose_language }}</h2>
  <p class="plain-help" id="location-help">
    {{ t.language_help }}
  </p>
  <div id="location-suggestions" class="plain-help" hidden role="status" aria-live="polite"></div>
  <button id="show-all-languages" class="voice-button" type="button" hidden>
    🌐 {{ t.show_all_languages }}
  </button>
  <button id="detect-location" class="btn secondary-btn" type="button">
    📍 {{ t.detect_language }}
  </button>
  <div id="voice-status" class="note" role="status" aria-live="polite"></div>
  <button class="btn secondary-btn" type="button" data-speak="page">
    🔊 {{ t.read_aloud }} / এই পৃষ্ঠা শুনক
  </button>
  <form method="post" class="language-options" aria-label="Language choices">
    {% for code, info in languages.items() %}
    <button class="language-button" type="submit" name="language" value="{{ code }}"
            data-language="{{ code }}" data-speech="{{ info.speech }}">
      {{ info.name }}
    </button>
    {% endfor %}
  </form>
  <p class="note">{{ t.language_help }}</p>
</div>
{% endblock %}
