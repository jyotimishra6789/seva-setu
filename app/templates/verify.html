{% extends "base.html" %}
{% block content %}
<div class="steps"><b>{{ t.step1_label }}</b></div>
<h2>{{ t.enter_otp }}</h2>
<p class="note">{{ t.otp_sent_to }} <b>{{ mobile }}</b>.</p>
<form method="post">
  <label>{{ t.otp_label }} *</label>
  <input type="text" name="otp" maxlength="6" inputmode="numeric" style="max-width:160px" required>
  <p><button class="btn" type="submit">{{ t.verify_button }}</button></p>
</form>
<p class="note">{{ t.otp_note }}</p>
{% endblock %}
