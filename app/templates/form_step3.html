{% extends "base.html" %}
{% block content %}
<div class="steps"><b>{{ t.step4_title }}</b></div>
<h2>{{ t.bank_details_title }}</h2>
<form method="post">
  <label>{{ t.bank_account_label }} *</label>
  <input type="text" name="bank_account" value="{{ data.get('bank_account','') }}" required>
  <label>{{ t.ifsc_label }} *</label>
  <input type="text" name="ifsc" value="{{ data.get('ifsc','') }}" required>
  <p class="note">{{ t.dbt_note }}</p>
  <p><button class="btn" type="submit">{{ t.save_continue }}</button></p>
</form>
{% endblock %}
