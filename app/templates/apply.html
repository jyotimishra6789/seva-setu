{% extends "base.html" %}
{% block content %}
<div class="steps"><b>{{ t.step1_label }}</b></div>
<div class="page-tools"><button class="voice-button" type="button" data-speak="global">🔊 {{ t.read_aloud }}</button></div>
<h2>{{ t.mobile_verification }}</h2>
<div class="plain-help">
  <strong>{{ t.free_help }}</strong> {{ t.apply_help }}
</div>
<form method="post">
  <label for="mobile">{{ t.mobile_label }} *</label>
  <input id="mobile" type="text" name="mobile" maxlength="10" inputmode="numeric"
         autocomplete="tel" placeholder="{{ t.mobile_placeholder }}" required>
  <p><button class="btn" type="submit">{{ t.send_otp }}</button></p>
</form>
<p class="note">{{ t.otp_note }}</p>
{% endblock %}
