{% extends "base.html" %}
{% block content %}
<div class="steps"><b>{{ t.step2_title }}</b></div>
<h2>{{ t.personal_details }}</h2>
<form method="post">
  <label>{{ t.applicant_name_label }} *</label>
  <input type="text" name="applicant_name" value="{{ data.get('applicant_name','') }}" required>
  
  <label>{{ t.dob_label }} *</label>
  <input type="text" name="dob" placeholder="{{ t.dob_placeholder }}" value="{{ data.get('dob','') }}" required>
  
  <label>{{ t.gender_label }} *</label>
  <select name="gender" required>
    <option value="">{{ t.gender_select }}</option>
    <option value="Male" {% if data.get('gender')=='Male' %}selected{% endif %}>{{ t.gender_male }}</option>
    <option value="Female" {% if data.get('gender')=='Female' %}selected{% endif %}>{{ t.gender_female }}</option>
    <option value="Other" {% if data.get('gender')=='Other' %}selected{% endif %}>{{ t.gender_other }}</option>
  </select>
  
  <label>{{ t.marital_status_label }} *</label>
  <select name="marital_status" id="marital_status" required>
    <option value="">{{ t.marital_select }}</option>
    <option value="Married" {% if data.get('marital_status')=='Married' %}selected{% endif %}>{{ t.marital_married }}</option>
    <option value="Unmarried" {% if data.get('marital_status')=='Unmarried' %}selected{% endif %}>{{ t.marital_unmarried }}</option>
    <option value="Widowed" {% if data.get('marital_status')=='Widowed' %}selected{% endif %}>{{ t.marital_widowed }}</option>
  </select>
  
  <div id="husband_fields">
    <label>{{ t.husband_name_label }}</label>
    <input type="text" name="husband_name" value="{{ data.get('husband_name','') }}">
    <label>{{ t.husband_employer_label }}</label>
    <input type="text" name="husband_employer" value="{{ data.get('husband_employer','') }}">
    <p class="note">{{ t.husband_help }}</p>
  </div>
  
  <p class="note">{{ t.mandatory_note }}</p>
  <p><button class="btn" type="submit">{{ t.save_continue }}</button></p>
</form>
{% endblock %}
