{% extends "base.html" %}
{% block content %}
<h2>{{ t.submitted_heading }}</h2>
<p>{{ t.submitted_msg }}</p>
<table class="tbl" style="max-width:520px;margin:18px 0">
  <tr><th>{{ t.app_no_label }}</th><td><b style="font-size:22px;color:#0b3d6e">{{ app_no }}</b></td></tr>
</table>
<p class="plain-help">{{ t.app_received_note }}</p>
<p>
  <a href="/ack/{{ app_id }}.pdf"><button class="btn">{{ t.download_ack }}</button></a>
  &nbsp;
  <a href="/status"><button class="btn" style="background:#555">{{ t.status }}</button></a>
</p>
{% endblock %}
