{% extends "base.html" %}
{% block content %}
<div class="steps"><b>{{ t.step5_title }}</b></div>
<h2>{{ t.upload_heading }}</h2>
<p class="note">{{ t.upload_help }}</p>
<form method="post" enctype="multipart/form-data">
  <label>{{ t.select_doc }} *</label>
  <input type="file" name="document" accept=".jpg,.jpeg,.png,.pdf" required>
  <p><button class="btn" type="submit">{{ t.upload_button }}</button></p>
</form>
{% endblock %}
